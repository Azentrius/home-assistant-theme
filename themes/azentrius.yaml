      ha-color-fill-danger-normal-active: "#fbc5c5"
      ha-color-fill-danger-quiet-active: "#fbc5c5"
      ha-color-on-danger-loud: "#ffffff"
      ha-color-on-danger-normal: "#151515"
      ha-color-on-danger-quiet: "#151515"
      ha-color-border-danger-loud: "#b1380b"
      ha-color-border-danger-normal: "#b1380b"
      ha-color-border-danger-quiet: "#fbc5c5"
      ha-color-fill-warning-loud-resting: "#b07e00"
      ha-color-fill-warning-normal-resting: "#ffe072"
      ha-color-fill-warning-quiet-resting: "#ffe072"
      ha-color-fill-warning-loud-hover: "#b07e00"
